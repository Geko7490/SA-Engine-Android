name: Android Unity Port

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      build_apk:
        description: 'Attempt Android APK build (requires Unity credentials)'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  source-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Android overlay
        uses: actions/checkout@v4

      - name: Run local integration tests (no Unity needed)
        run: python3 -m unittest discover -s tests -v

      - name: Set up .NET for the standalone DXT decoder check
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Compile and execute DXT1/DXT3 pixel tests
        run: |
          set -euo pipefail
          dotnet new console --framework net8.0 --output /tmp/sa-android-dxt --no-restore
          cp tests/DxtDecoderSmoke.cs /tmp/sa-android-dxt/Program.cs
          cp UnityPort/Assets/Scripts/Importing/Conversion/MobileDxtDecoder.cs /tmp/sa-android-dxt/
          cp tests/UnityApiStubs.cs /tmp/sa-android-dxt/
          cp UnityPort/Assets/Scripts/Performance/*.cs /tmp/sa-android-dxt/
          cp UnityPort/Assets/Editor/SAAndroidBuild.cs /tmp/sa-android-dxt/
          dotnet run --project /tmp/sa-android-dxt --configuration Release -p:DefineConstants=UNITY_ANDROID
          dotnet build /tmp/sa-android-dxt --configuration Release -p:DefineConstants=UNITY_EDITOR

      - name: Compile Android bridge Java against Android SDK
        run: |
          set -euo pipefail
          echo "Compiling game file bridge with Android API stubs"
          sdkJar="$ANDROID_HOME/platforms/android-35/android.jar"
          if [ ! -f "$sdkJar" ]; then
            sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
            "$sdkmanager" "platforms;android-35"
          fi
          mkdir -p /tmp/sa-bridge-classes
          javac -source 8 -target 8 -cp "$sdkJar" -d /tmp/sa-bridge-classes \
            UnityPort/Assets/Plugins/Android/SAEngineBridge.androidlib/src/main/java/com/geko7490/saenginegame/GameDataReceiver.java
          test -s /tmp/sa-bridge-classes/com/geko7490/saenginegame/GameDataReceiver.class

      - name: Clone pinned SanAndreasUnity and submodules
        run: bash scripts/checkout-upstream.sh SanAndreasUnity

      - name: Install overlay and patch original mobile FPS conflict
        run: bash scripts/prepare-unity-port.sh SanAndreasUnity

      - name: Check source integration
        run: |
          set -euo pipefail
          test -s SanAndreasUnity/Assets/Scripts/Performance/MobilePerformanceGovernor.cs
          test -s SanAndreasUnity/Assets/Scripts/Performance/MobilePerformanceBootstrap.cs
          test -s SanAndreasUnity/Assets/Editor/SAAndroidBuild.cs
          test -s SanAndreasUnity/Assets/Scripts/Performance/GameDataBridge.cs
          test -s SanAndreasUnity/Assets/Plugins/Android/SAEngineBridge.androidlib/src/main/java/com/geko7490/saenginegame/GameDataReceiver.java
          grep -q 'GameDataBridge.Begin' SanAndreasUnity/Assets/Scripts/Behaviours/Loader.cs
          grep -q '2020.3.26f1' SanAndreasUnity/ProjectSettings/ProjectVersion.txt
          grep -q 'SA_ANDROID_TARGET_FPS' SanAndreasUnity/Assets/Scripts/Behaviours/GameManager.cs
          echo "Source preflight passed; Unity compilation is a separate step."

  android-build:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_apk }}
    needs: source-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout overlay
        uses: actions/checkout@v4

      - name: Clone pinned SanAndreasUnity
        run: bash scripts/checkout-upstream.sh SanAndreasUnity

      - name: Install overlay
        run: bash scripts/prepare-unity-port.sh SanAndreasUnity

      - name: Verify Unity activation variables
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -z "$UNITY_LICENSE" ] && { [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; }; then
            echo "::error::Configure UNITY_LICENSE or UNITY_EMAIL and UNITY_PASSWORD as repository secrets."
            exit 1
          fi

      - name: Compile Android ARM64 APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: SanAndreasUnity
          unityVersion: 2020.3.26f1
          targetPlatform: Android
          buildMethod: SAAndroidBuild.BuildArm64
          versioning: None

      - name: Upload actual APK
        uses: actions/upload-artifact@v4
        with:
          name: SAEngineAndroid-development-apk
          path: SanAndreasUnity/Builds/SAEngineAndroid-dev.apk
          if-no-files-found: error
