name: Build Android Launcher APK

on:
  push:
    branches: [main]
    paths:
      - 'AndroidLauncher/**'
      - '.github/workflows/android-launcher.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: launcher-dev-release
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 35 SDK and build tools
        run: |
          set -euo pipefail
          echo "Using preinstalled Android SDK at $ANDROID_HOME"
          SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDK_MANAGER" ]; then
            echo "::error::No Android command line tools available on runner"
            exit 1
          fi
          "$SDK_MANAGER" --version
          yes | "$SDK_MANAGER" --licenses > /dev/null || true
          "$SDK_MANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble real debug APK (no Unity license required)
        run: gradle -p AndroidLauncher --no-daemon --stacktrace :app:assembleDebug

      - name: Run release catalogue and integrity unit tests
        run: gradle -p AndroidLauncher --no-daemon :app:testDebugUnitTest

      - name: Verify APK exists and record SHA256
        run: |
          set -euo pipefail
          apk=AndroidLauncher/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          ls -lh "$apk"
          sha256sum "$apk" | tee AndroidLauncher/apk-sha256.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | head -n 9

      - name: Publish APK to private GitHub Release (avoids artifact quota)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk=AndroidLauncher/app/build/outputs/apk/debug/app-debug.apk
          asset="$apk#SAEngineMobile-Launcher-debug.apk"
          if gh release view launcher-dev --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload launcher-dev "$asset" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit launcher-dev --repo "$GITHUB_REPOSITORY" --notes "V0.5.3: native GTA SA Android 2.10/experimental 2.11 ARM64 FPS mod download+installation, 30/60/90/120 cap selection, original game launch, and data importer. Requires legally owned GTA SA with AML+SAUtils. No game APK supplied. Last build: $GITHUB_SHA"
          else
            gh release create launcher-dev "$asset" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "SA Engine Mobile — Android launcher preview" --notes "V0.5.3: native GTA SA Android 2.10/experimental 2.11 ARM64 FPS mod download+installation, 30/60/90/120 cap selection, original game launch, and data importer. Requires legally owned GTA SA with AML+SAUtils. No game APK supplied. Build: $GITHUB_SHA"
          fi
          echo "APK release: https://github.com/$GITHUB_REPOSITORY/releases/tag/launcher-dev"
