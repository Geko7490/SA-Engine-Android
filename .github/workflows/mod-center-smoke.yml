name: GTA SA Mod Center Android Emulator Smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mod-center-smoke.yml'
      - 'AndroidLauncher/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mod-center-emulator
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Configure Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile Mod Center APK and tests
        run: |
          gradle -p AndroidLauncher --no-daemon :app:assembleDebug :app:testDebugUnitTest

      - name: Enable hardware virtualization
        run: |
          if [ -e /dev/kvm ]; then ls -l /dev/kvm; fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null || true
          sudo udevadm control --reload-rules || true
          sudo udevadm trigger --name-match=kvm || true

      - name: Install and open launcher and Mod Center on Android 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            set -euo pipefail
            apk=AndroidLauncher/app/build/outputs/apk/debug/app-debug.apk
            adb install -r "$apk"
            adb shell am start -n com.geko7490.saengineandroid/.MainActivity
            sleep 4
            adb shell am start -n com.geko7490.saengineandroid/.ModCenterActivity
            sleep 5
            adb shell dumpsys activity activities | grep -F 'com.geko7490.saengineandroid/.ModCenterActivity'
            adb shell logcat -d -v brief > /tmp/mod-center-logcat.txt
            if grep -A 15 'FATAL EXCEPTION' /tmp/mod-center-logcat.txt | grep -F 'com.geko7490.saengineandroid'; then
              echo "::error::Mod Center Android activity crashed" >&2
              exit 1
            fi
            echo "Mod Center Activity launch smoke passed (Shizuku absent; no original game installed)"
